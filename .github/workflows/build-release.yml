name: Build and Release Executable

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a version tag like v1.5.0

jobs:
  build-exe:
    name: Compile PowerShell Matrix on Windows Cloud
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
      - name: Check out repository code structure
        uses: actions/checkout@v4

      - name: Setup Environment and Compile Standalone Binary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "[i] Trusting PSGallery repository channels..."
          Set-PSRepository -Name "PSGallery" -InstallationPolicy Trusted
          
          Write-Host "[i] Installing PS2EXE compilation engine from PowerShell Gallery..."
          Install-Module -Name ps2exe -Force -SkipPublisherCheck -Scope CurrentUser
          
          Write-Host "[i] Constructing isolated distribution staging folders..."
          if (Test-Path ".\dist") { Remove-Item ".\dist" -Recurse -Force }
          New-Item -ItemType Directory -Path ".\dist" -Force | Out-Null
          
          Write-Host "[i] Executing core binary compilation sequence via PS2EXE..."
          Invoke-ps2exe -inputFile ".\src\Main.ps1" -outputFile ".\dist\winutil-apex.exe" -title "WinUtil Apex Core" -description "Next-Gen Windows Optimization Matrix Suite" -noConsole -x86
          
          Write-Host "[OK] Core compilation successful. Copying supporting graphic visual assets..."
          if (-not (Test-Path ".\dist\src")) { New-Item -ItemType Directory -Path ".\dist\src" -Force | Out-Null }
          Copy-Item -Path ".\src\*" -Destination ".\dist\src\" -Recurse -Force
          
          Write-Host "[OK] Packaging absolute distribution ZIP bundle..."
          if (Test-Path ".\winutil-apex-v1.5.0.zip") { Remove-Item ".\winutil-apex-v1.5.0.zip" -Force }
          Compress-Archive -Path ".\dist\*" -DestinationPath ".\winutil-apex-v1.5.0.zip" -Force
          
          Write-Host "[OK] Build operation completed successfully!"

      - name: Publish Production Package Live to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          name: "WinUtil Apex Core Framework Release ${{ github.ref_name }}"
          files: |
            .\dist\winutil-apex.exe
            .\winutil-apex-v1.5.0.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
